<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a Quote | GLDC</title><meta name="description" content="A multi-step-inspired project enquiry form. Submission creates a lead and notification in the Management Console demo."><link rel="stylesheet" href="assets/style.css"></head><body data-page="public">
<section class="page-hero"><div class="container"><div class="breadcrumb"><a href="index.html">Home</a> / Request a Quote</div><span class="eyebrow">PROJECT ENQUIRY</span><h1>Tell GLDC what you need.</h1><p>A multi-step-inspired project enquiry form. Submission creates a lead and notification in the Management Console demo.</p></div></section>
<section class="section"><div class="container"><form id="quoteForm" class="form-card"><div class="chips"><span class="tag">STEP 1 — SERVICE</span><span class="tag">STEP 2 — LOCATION</span><span class="tag">STEP 3 — PROJECT</span><span class="tag">STEP 4 — DOCUMENTS</span></div><div class="form-grid" style="margin-top:24px"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Service</label><select name="service"><option>Land planning</option><option>Architectural design</option><option>Property development</option><option>Surveying</option><option>Construction consultancy</option><option>Approvals</option><option>Other</option></select></div><div class="field"><label>County</label><input name="county" required></div><div class="field"><label>Town / Area</label><input name="town" required></div><div class="field full"><label>Plot / Location</label><input name="plot"></div><div class="field full"><label>Project description</label><textarea name="description" required></textarea></div><div class="field"><label>Approximate size</label><input name="size"></div><div class="field"><label>Desired timeline</label><input name="timeline"></div><div class="field"><label>Budget range (optional)</label><input name="budget"></div><div class="field"><label>Upload documents</label><input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"></div><div class="field full"><label><input type="checkbox" required> I accept the privacy/consent requirement.</label></div><div class="field full"><button class="btn primary">SUBMIT PROJECT ENQUIRY</button></div></div></form></div></section>
<script src="assets/app.js"></script></body></html>
